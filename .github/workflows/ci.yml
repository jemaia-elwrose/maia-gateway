name: ci
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    env:
      MEDIAMTX_VERSION: v1.21.4
    steps:
      - uses: actions/checkout@v5
      - name: GStreamer, Redis
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3-gi gir1.2-gstreamer-1.0 \
            gir1.2-gst-plugins-base-1.0 gstreamer1.0-tools gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-plugins-ugly \
            gstreamer1.0-libav gstreamer1.0-rtsp redis-server
      - name: MediaMTX
        run: |
          curl -sSL "https://github.com/bluenviron/mediamtx/releases/download/${MEDIAMTX_VERSION}/mediamtx_${MEDIAMTX_VERSION}_linux_amd64.tar.gz" | tar xz -C /tmp
          echo "MEDIAMTX=/tmp/mediamtx" >> "$GITHUB_ENV"
      - name: Install (system Python, which has the GStreamer bindings)
        run: |
          /usr/bin/python3 -m venv --system-site-packages .venv
          .venv/bin/pip install -e ".[dev]"
      - name: Lint
        run: .venv/bin/ruff check --output-format=github . && .venv/bin/ruff format --check --diff .
      - name: Test
        run: .venv/bin/pytest -q -rs
      - name: Decode benchmark
        run: .venv/bin/maia-gateway bench --seconds 3

  docker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Build the image (CPU + NVIDIA in one)
        run: docker build -f docker/Dockerfile -t maia-gateway:ci .
      - name: Smoke test
        run: docker run --rm maia-gateway:ci maia-gateway decoders
