# Cameras the gateway adds (or updates) on start. Add your own: an RTSP URL is pulled
# through MediaMTX once, and is then watchable at http://<host>:8889/<camera>/ (WebRTC).
cameras:
  sim-1:                                  # the simulated camera from docker compose
    source: rtsp://mediamtx:8554/sim
    sampling: {mode: fps, fps: 5}
    clips: {pre_s: 5, post_s: 10}

