# docker compose up --build                      # MediaMTX + Redis + gateway + a simulated camera
# docker compose -f docker-compose.yml -f docker-compose.gpu.yml up --build   # NVIDIA GPU decode
#
# Then: http://localhost:8080/docs (API), http://localhost:8889/sim-1/ (live view),
#       maia-gateway cameras / curl localhost:8080/cameras
#
# Ports are published on 127.0.0.1 only. To reach the stack from other machines set
# MAIA_BIND=0.0.0.0 and MAIA_API_KEY (Docker's published ports bypass host firewalls such as
# ufw, so an open cloud security group is enough for scanners to find the API).
#
# Ports busy on the host? Change only the host side, e.g. MAIA_RTSP_PORT=7554 docker compose up
# (inside the network everything keeps MediaMTX's standard ports).
#
# Rings live in the host's shared memory (ipc: host), so pipelines and maia-infer workers
# on this machine can read frames in place. Set MAIA_IPC=private to isolate the gateway.
# The gateway runs as root, so rings are given to group MAIA_RING_GID (default 1000, the
# first user's group on most Linux machines) for scripts on the host to read; use
# MAIA_RING_GID=$(id -g) docker compose up if yours differs (`id -g` prints it).
x-gateway: &gateway
  build: { context: ., dockerfile: docker/Dockerfile }
  image: maia-gateway:local
  environment:
    MAIA_REDIS_URL: redis://redis:6379/0
    MAIA_MEDIAMTX_API: http://mediamtx:9997
    MAIA_MEDIAMTX_RTSP: rtsp://mediamtx:8554
    MAIA_PUBLIC_HOST: ${MAIA_PUBLIC_HOST:-localhost}
    MAIA_API_KEY: ${MAIA_API_KEY:-}
    MAIA_RING_GID: ${MAIA_RING_GID:-1000}
    MAIA_VIEW_RTSP_PORT: ${MAIA_RTSP_PORT:-8554}
    MAIA_VIEW_HLS_PORT: ${MAIA_HLS_PORT:-8888}
    MAIA_VIEW_WEBRTC_PORT: ${MAIA_WEBRTC_PORT:-8889}
  ports: ["${MAIA_BIND:-127.0.0.1}:${MAIA_API_PORT:-8080}:8080"]
  volumes:
    - ./docker/cameras.yml:/config/cameras.yml:ro
    - ./clips:/clips
    - ./videos:/videos:ro        # video files used as cameras (file:///videos/...)
  ipc: ${MAIA_IPC:-host}
  depends_on: [redis, mediamtx]
  restart: unless-stopped

services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports: ["127.0.0.1:${MAIA_REDIS_PORT:-6379}:6379"]   # pipelines on this host read the frame index here
    restart: unless-stopped

  mediamtx:
    image: bluenviron/mediamtx:1.21.4
    volumes: ["./docker/mediamtx.yml:/mediamtx.yml:ro"]
    ports:
      - "${MAIA_BIND:-127.0.0.1}:${MAIA_RTSP_PORT:-8554}:8554"        # RTSP
      - "${MAIA_BIND:-127.0.0.1}:${MAIA_HLS_PORT:-8888}:8888"         # HLS
      - "${MAIA_BIND:-127.0.0.1}:${MAIA_WEBRTC_PORT:-8889}:8889"      # WebRTC
      - "${MAIA_BIND:-127.0.0.1}:8189:8189/udp"    # WebRTC media
      - "${MAIA_BIND:-127.0.0.1}:8189:8189"        # WebRTC media over TCP
    restart: unless-stopped

  # A synthetic H.264 camera published to MediaMTX, so the stack works with no hardware.
  camera-sim:
    build: { context: ., dockerfile: docker/Dockerfile }
    image: maia-gateway:local
    entrypoint: ["gst-launch-1.0", "-q"]
    command: >-
      videotestsrc is-live=true pattern=ball ! video/x-raw,width=1280,height=720,framerate=25/1
      ! videoconvert ! x264enc tune=zerolatency speed-preset=ultrafast key-int-max=50
      ! h264parse ! rtspclientsink location=rtsp://mediamtx:8554/sim protocols=tcp
    depends_on: [mediamtx]
    restart: unless-stopped

  gateway:
    <<: *gateway
